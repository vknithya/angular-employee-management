<div class="login-container">
  <mat-card class="login-card">

    <h1>Employee Management Portal</h1>
    <h2>Sign in to continue</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email Address</mat-label>
            <input matInput type="name" formControlName="email" placeholder="Enter your email" />

            <mat-error *ngIf="loginForm.controls.email.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="loginForm.controls.email.hasError('email')">Please enter a valid email address</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>

            <input
                matInput
                [type]="hidePassword ? 'password' : 'text'"
                formControlName="password"
                placeholder="Enter your password">

            <button
                mat-icon-button
                matSuffix
                type="button"
                (click)="togglePasswordVisibility()"> 
        
                <mat-icon>
                {{ hidePassword ? 'visibility' : 'visibility_off' }}
                </mat-icon>
            </button>
            @if(loginForm.controls.password.hasError('required')) {   
            <mat-error >
                Password is required.
            </mat-error>
            }
            <mat-error *ngIf="loginForm.controls.password.hasError('minlength')">
                Password must be at least 8 characters.
            </mat-error>

        </mat-form-field>
        <div class="login-options">
            <mat-checkbox formControlName="rememberMe">
                Remember Me
            </mat-checkbox>
              <a href="javascript:void(0)" class="forgot-password">
                Forgot Password?
              </a>
        </div>
        <button
            mat-flat-button
            color="primary"
            class="full-width login-button"
            type="submit"
            >
            @if (isLoading) {
                <span class="button-content">
                <mat-spinner diameter="18"
                strokeWidth="3"></mat-spinner>
                <span>Signing In...</span>
                </span>
            } @else {
                <span>Sign In</span>
            }
        </button>
        
    </form>

  </mat-card>
</div>
<!-- 
//(click)="hidePassword = !hidePassword" To improve Readability, Maintainability, Testability, Separation of concerns
//*ngIf="loginForm.controls.password.hasError('required')"
//[disabled]="loginForm.invalid"
-->
